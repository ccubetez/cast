services:
  db:
    image: postgres:16-alpine
    container_name: cast-db
    environment:
      POSTGRES_USER: cast
      POSTGRES_PASSWORD: cast
      POSTGRES_DB: cast
    ports:
      - '5433:5432' # 5432 занят локальным postgres (Homebrew)
    volumes:
      - cast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cast -d cast']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cast-pgdata:
